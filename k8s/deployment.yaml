apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-lab-app
  namespace: cicd-demo
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: eks-lab-app
  template:
    metadata:
      labels:
        app: eks-lab-app
    spec:
      containers:
      - name: eks-lab-app
        image: 723757256210.dkr.ecr.us-east-1.amazonaws.com/eks-lab-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eks-lab-app
  namespace: cicd-demo
spec:
  selector:
    app: eks-lab-app
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
